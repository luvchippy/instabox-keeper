name: instabox-keeper

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: instabox-keeper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  keeper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run keeper loop
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
          INSTABOX_MACHINE: ${{ secrets.INSTABOX_MACHINE }}
          INSTABOX_BUFFER_MINUTES: '20'
        run: |
          END=$(( $(date +%s) + 120 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            python instabox_keeper.py || true
            sleep 30
          done

      - name: Re-dispatch next round
        if: always()
        env:
          PAT: ${{ secrets.DISPATCH_PAT }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $PAT" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/instabox-keeper.yml/dispatches" \
            -d '{"ref":"main"}' -w "dispatch HTTP %{http_code}\n"
